name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform 37
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          (yes | sdkmanager --licenses > /dev/null) || true
          sdkmanager --install "platforms;android-37" || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew :app:assembleDebug
      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Gitune-${GITHUB_REF_NAME}.apk"
          cd release
          sha256sum "Gitune-${GITHUB_REF_NAME}.apk" > "Gitune-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Gitune ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
